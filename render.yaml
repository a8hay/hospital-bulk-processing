# Render Blueprint: a Docker web service plus a managed Postgres.
# Free-tier Postgres instances expire; check Render's current limits before relying on one.
services:
  - type: web
    name: hospital-bulk
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: hospital-bulk-db
          property: connectionString

databases:
  - name: hospital-bulk-db
    plan: free
